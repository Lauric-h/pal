services:
  pal:
    image: ghcr.io/lauric-h/pal:latest
    ports:
      - "8080:8080"
    environment:
      DB_PATH: /data/library.db
      PORT: "8080"
      OPENLIBRARY_USER_AGENT: "pal/1.0 (personal library)"
      GOOGLE_BOOKS_API_KEY: "${GOOGLE_BOOKS_API_KEY:-}"
    volumes:
      - ./data:/data
    restart: unless-stopped